name: Deploy to Firebase Hosting (live)

# Every push to main is checked, built as a static site and published to https://ksu-tamanschool.web.app
on:
  push:
    branches: [main]

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Next type-checks during the build, so a type error stops the deploy here.
      - run: npm run build:firebase
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KSU_TAMANSCHOOL }}
          channelId: live
          projectId: ksu-tamanschool
